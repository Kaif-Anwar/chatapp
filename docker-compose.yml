version: '3.8'

# Load environment variables from .env file (not committed to git).
# Required vars: JWT_SECRET, MYSQL_ROOT_PASSWORD
# Optional:      COMPOSE_PROJECT_NAME (default: antigravity-chatapp)

services:

  # ── MySQL Database ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: antigravity-chatapp-mysql
    environment:
      MYSQL_DATABASE: chatapp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - antigravity_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: antigravity-chatapp-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ──────────────────────────────────────
  app:
    build: .
    image: antigravity-chatapp-backend:latest
    container_name: antigravity-chatapp-backend
    # Bind to 127.0.0.1 only — not exposed to the internet.
    # The nginx frontend container proxies all traffic internally.
    # For local dev without the frontend container, use:
    #   ports: ["127.0.0.1:8081:8080"]
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - antigravity_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── React Frontend + Nginx Reverse Proxy ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: antigravity-chatapp-frontend:latest
    container_name: antigravity-chatapp-frontend
    ports:
      - "80:80"          # HTTP — redirects to HTTPS
      - "443:443"        # HTTPS — main entry point
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro   # SSL certs from host certbot
    depends_on:
      - app

volumes:
  antigravity_mysql_data:
  antigravity_uploads:
