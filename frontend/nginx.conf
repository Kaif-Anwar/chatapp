##############################################################################
# Rate limiting zones — defined at http level (outside server block)
# Format: limit_req_zone <key> zone=<name>:<size> rate=<rate>
##############################################################################
limit_req_zone $binary_remote_addr zone=auth_login:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=auth_refresh:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=avatar_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_api:10m   rate=60r/s;

# Custom JSON error page for 429 Too Many Requests
map $status $rate_limit_message {
    429  '{"error":"Too many requests","message":"Rate limit exceeded. Please wait and try again.","status":429}';
    default '';
}

server {
    listen 80;
    server_name _;

    # ── Global security headers ───────────────────────────────────────────
    # Applied to every response from this server block
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-XSS-Protection         "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self';
         connect-src 'self' ws: wss:;
         img-src     'self' data: blob:;
         script-src  'self' 'unsafe-inline';
         style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
         font-src    'self' https://fonts.gstatic.com;
         object-src  'none';
         base-uri    'self';"
        always;

    # Hide nginx version from response headers
    server_tokens off;

    # ── React SPA static files ────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Auth endpoints — with strict rate limiting ────────────────────────
    # Login: 5 requests/minute per IP, burst of 3 allowed
    location = /api/auth/login {
        limit_req zone=auth_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/auth/login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Register: 3 requests/minute per IP, burst of 2 allowed
    location = /api/auth/register {
        limit_req zone=auth_register burst=2 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/auth/register;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Refresh: 10 requests/minute per IP, burst of 5 allowed
    location = /api/auth/refresh {
        limit_req zone=auth_refresh burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/auth/refresh;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Avatar upload — rate limited to prevent disk exhaustion ──────────
    location = /api/users/me/avatar {
        limit_req zone=avatar_upload burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/users/me/avatar;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow larger body for file uploads (matches Spring multipart config)
        client_max_body_size 10m;
    }

    # ── General Spring Boot API — with baseline rate limit ────────────────
    location /api/ {
        limit_req zone=general_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket proxy (STOMP over SockJS) ──────────────────────────────
    # SockJS uses HTTP long-polling as well as native WS upgrades.
    location /ws {
        proxy_pass             http://app:8080/ws;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # ── Avatar / uploaded files proxy ────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://app:8080/uploads/;
        proxy_set_header   Host $host;
        # Cache avatars in the browser for 7 days
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # ── Block Swagger in production ───────────────────────────────────────
    # Swagger is disabled at the Spring level too, but double-lock at nginx
    location /swagger-ui {
        return 404;
    }
    location /v3/ {
        return 404;
    }

    # ── Custom error page for rate limiting ──────────────────────────────
    error_page 429 = @rate_limited;
    location @rate_limited {
        add_header Content-Type "application/json" always;
        return 429 '{"error":"Too many requests","message":"Rate limit exceeded. Please slow down and try again.","status":429}';
    }

    # ── React SPA — serve index.html for all other routes ────────────────
    # Must be last — catch-all for React Router client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
