##############################################################################
# Rate limiting zones — defined at http level (outside server block)
# Format: limit_req_zone <key> zone=<name>:<size> rate=<rate>
##############################################################################
limit_req_zone $binary_remote_addr zone=auth_login:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=auth_refresh:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=avatar_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_api:10m   rate=60r/s;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
# All plain HTTP traffic is immediately upgraded to HTTPS (301 permanent)
server {
    listen 80;
    server_name mychatsweb.tech www.mychatsweb.tech;
    server_tokens off;

    # Allow Let's Encrypt ACME challenge for cert renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name mychatsweb.tech www.mychatsweb.tech;
    server_tokens off;

    # ── SSL Certificate (Let's Encrypt via Certbot) ───────────────────────
    ssl_certificate     /etc/letsencrypt/live/mychatsweb.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mychatsweb.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Global security headers ───────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-XSS-Protection         "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self';
         connect-src 'self' ws: wss:;
         img-src     'self' data: blob:;
         script-src  'self' 'unsafe-inline';
         style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
         font-src    'self' https://fonts.gstatic.com;
         object-src  'none';
         base-uri    'self';"
        always;

    # ── React SPA static files ────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Auth endpoints — with strict rate limiting ────────────────────────
    location = /api/auth/login {
        limit_req zone=auth_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/auth/login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/auth/register {
        limit_req zone=auth_register burst=2 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/auth/register;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/auth/refresh {
        limit_req zone=auth_refresh burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/auth/refresh;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Avatar upload — rate limited ──────────────────────────────────────
    location = /api/users/me/avatar {
        limit_req zone=avatar_upload burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/users/me/avatar;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # ── General API ───────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=general_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket proxy (STOMP over SockJS) ──────────────────────────────
    location /ws {
        proxy_pass             http://app:8080/ws;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # ── Uploaded files proxy ──────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://app:8080/uploads/;
        proxy_set_header   Host $host;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # ── Block Swagger ─────────────────────────────────────────────────────
    location /swagger-ui { return 404; }
    location /v3/ { return 404; }

    # ── Custom rate limit error ───────────────────────────────────────────
    error_page 429 = @rate_limited;
    location @rate_limited {
        add_header Content-Type "application/json" always;
        return 429 '{"error":"Too many requests","message":"Rate limit exceeded. Please slow down and try again.","status":429}';
    }

    # ── React SPA — catch-all ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
