server:
  port: 8080

app:
  upload:
    dir: ${UPLOAD_DIR:uploads/avatars}
  cors:
    # Comma-separated list of allowed origins. Override with CORS_ORIGINS env var in production.
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/chatapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6380

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JWT secret MUST be set via environment variable in production.
# Generate a secure value with: openssl rand -hex 64
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-CHANGE-THIS-IN-PRODUCTION-do-not-use-in-prod}
  access-expiry-ms: 900000        # 15 minutes
  refresh-expiry-ms: 604800000    # 7 days

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.kaif.chatapp: DEBUG
    org.springframework.web.socket: DEBUG
