server:
  port: 8080

app:
  upload:
    dir: ${UPLOAD_DIR:uploads/avatars}
  messages:
    upload:
      dir: ${MESSAGE_UPLOAD_DIR:uploads/messages}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  auth:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@mychatsweb.tech}

spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/chatapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6380

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JWT secret MUST be set via environment variable in production.
# Generate a secure value with: openssl rand -hex 64
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-CHANGE-THIS-IN-PRODUCTION-do-not-use-in-prod}
  access-expiry-ms: 900000        # 15 minutes
  refresh-expiry-ms: 604800000    # 7 days

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.kaif.chatapp: DEBUG
    org.springframework.web.socket: DEBUG
